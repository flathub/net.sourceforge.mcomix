name: python3-buildbackend
modules:
  - name: python3-flit-core
    buildsystem: simple
    cleanup:
      - '*'
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "flit-core" --no-build-isolation
    sources:
      - type: file
        url: 
          https://files.pythonhosted.org/packages/d3/8b/0370578a456986d6995344967a479dd5c9d4e064681550c2a9594bb58b4a/flit_core-4.2.0.tar.gz
        sha256: 84e4e4d8fdd45ba2613800a3ebc6834de26d47ec9746efc3719f94181137b460
        x-checker-data:
          name: flit-core
          type: pypi

  - name: python3-meson-python
    buildsystem: simple
    cleanup:
      - '*'
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "meson-python" --no-build-isolation
    sources:
      - type: file
        url: 
          https://files.pythonhosted.org/packages/4f/76/1cae539918a7b1746d624c2f01560b793c22cd8c081157505bb9bbf0e34d/pyproject_metadata-0.12.1.tar.gz
        sha256: 8809a4df6fe08279b39a8890669506ed3158e0617855ac9aff098fcbe772ae4c
        x-checker-data:
          name: pyproject-metadata
          type: pypi
      - type: file
        url: 
          https://files.pythonhosted.org/packages/96/62/0c1cf20fe158b0e623e78acbf5fb6de5f1410a408f65f727e4090497627b/meson_python-0.22.1-py3-none-any.whl
        sha256: 258fde948cf45aab5df23fcc9e17a9050ee73d4e1002fe6cf86519f61c414778
        x-checker-data:
          name: meson-python
          type: pypi
          packagetype: bdist_wheel


