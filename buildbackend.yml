name: python3-buildbackend
modules:
  - name: python3-flit-core
    buildsystem: simple
    cleanup:
      - '*'
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "flit-core" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/46/ef/34533186e76c526d9ec17a1ad9a10c7354cbfb20f51583cc36dfe4bdccd0/flit_core-4.0.2.tar.gz
        sha256: b6929defd93884b584d7c87829e0e7b5c26ed6be17b0b873979019314aa841c8
        x-checker-data:
          name: flit-core
          type: pypi

  - name: python3-meson-python
    buildsystem: simple
    cleanup:
      - '*'
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "meson-python" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/4f/76/1cae539918a7b1746d624c2f01560b793c22cd8c081157505bb9bbf0e34d/pyproject_metadata-0.12.1.tar.gz
